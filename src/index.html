<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DevHub Bot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #04040b;
        --card: rgba(12, 12, 24, 0.75);
        --border: rgba(124, 124, 255, 0.2);
        --text: #e5e7ff;
        --muted: #9194b8;
        --accent: #8b8dff;
        --accent-glow: rgba(139, 141, 255, 0.35);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          radial-gradient(
            circle at center,
            rgba(90, 90, 255, 0.12),
            transparent 50%
          ),
          var(--bg);

        background-size:
          48px 48px,
          48px 48px,
          auto,
          auto;

        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 32px;
      }

      .container {
        width: 100%;
        max-width: 1100px;
        text-align: center;
      }

      .badge {
        display: inline-block;

        padding: 10px 18px;

        border: 1px solid var(--border);
        background: rgba(139, 141, 255, 0.08);

        color: var(--accent);

        letter-spacing: 0.12em;
        text-transform: uppercase;

        margin-bottom: 40px;
      }

      h1 {
        font-family: "Pixelify Sans", sans-serif;

        font-size: clamp(4rem, 10vw, 8rem);
        line-height: 1.05;

        margin-bottom: 24px;

        text-shadow: 0 0 30px var(--accent-glow);
      }

      .accent {
        color: var(--accent);
      }

      .subtitle {
        max-width: 850px;
        margin: auto;

        color: var(--muted);

        font-size: 1.15rem;
        line-height: 1.8;
      }

      .buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;

        margin-top: 48px;
      }

      .btn {
        text-decoration: none;
        color: white;

        padding: 14px 24px;

        border: 1px solid var(--border);

        background: rgba(139, 141, 255, 0.12);

        transition: 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .secondary {
        background: transparent;
      }

      .cards {
        margin-top: 72px;

        display: grid;
        gap: 18px;

        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .card {
        background: var(--card);

        border: 1px solid var(--border);

        padding: 24px;

        text-align: left;

        backdrop-filter: blur(10px);
      }

      .card h3 {
        margin-bottom: 12px;
        color: var(--accent);
      }

      .card p {
        color: var(--muted);
        line-height: 1.7;
      }

      .footer {
        margin-top: 60px;
        color: #6d7095;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">■ ONLINE: GITHUB APP ACTIVE</div>

      <h1>DevHub <span class="accent">Bot</span></h1>

      <p class="subtitle">
        A GitHub App built to Automate repository workflows, enforce standards,
        improve pull request quality, and keep projects healthy.
      </p>

      <div class="buttons">
        <a href="https://github.com/open-devhub/devhub-bot" class="btn">
          Repository →
        </a>

        <a href="https://github.com/open-devhub" class="btn secondary">
          GitHub Organization ↗
        </a>
      </div>

      <div class="footer">Built by DevHub • GitHub App • Vercel</div>
    </main>
  </body>
</html>
